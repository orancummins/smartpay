evidence: &fhb_ev
  evidence_type: issuer_reward_rule
  source_name: First Hawaiian Bank
  source_url: "https://www.fhb.com/en/personal/credit-cards/priority-destinations-world-elite"
  verified_at: 2026-09-02
  confidence: authoritative
  note: >-
    First Hawaiian Bank Priority Destinations World Elite published earn rates,
    annual fee and network tier. Base multiplier and category rates set so that
    base + the sourced issuer bonus program (see data/mastercard/rewards_catalog.json,
    issuer_key first_hawaiian) reconstruct the card's own published total rates of
