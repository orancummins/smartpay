late_payment_fee_evidence:
  evidence_type: issuer_reward_rule
  source_name: First Hawaiian Bank
  source_url: "https://www.fhb.com/sites/default/files/2020-10/PriorityDestinationsCreditCardCombinedRatesDisclosures.pdf"
